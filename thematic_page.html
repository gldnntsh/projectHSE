<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>тематическая страница</title>
</head>
<body>
  <h1 style="text-align:center; color:blue">путешествия</h1>
   <p> <a href="country">страны для путешествий </a></p>
   <p><a href="transport">виды транспорта</a></p>
    <p><a href="picture">фотографии</a></p>
    <p><a href="info.html#down">Перейти вниз></a></p>
    <hr>
    <h3 id="country">страны дял путешествий</h3>
    <ul style="list-style-type:square;">
             <li>китай</li>
             <li>мьянма</li>
             <li><i>сша</i></li>
                 <ul style="list-style-type:circle";>
                    <li>нью-Йорк</li>
                    <li>вашингтон</li>
                 </ul>
             <li>беларусь</li>
    </ul>
    <p><a href="info.html#down">Перейти вниз></a></p>
    <h3 id="transport">виды транспорта</h3>
    <ul type='A' style="color:green">
        <li><u>самолет</u></li>
        <li>поезд</li>
        <li>машина</li>
        <li>корабль</li>
    </ul>
    <p><a href="info.html#down">Перейти вниз></a></p>
    <h3 id="picture">фотографии</h3>
    <ul type="I">
        <li><a href="images/sea.jpg" target="_blank"><img src="images/sea.jpg" width="10" height="10" alt="sea"></a></li>
        <li><a href="images/mountanes.jpg" onclick="return zoom2(this.href);"><img src="images/mountanes.jpg" width="10" height="10" alt="mountanes"></a></li>
    </ul>
    <p><a href="info.html#up">Перейти вверх</a></p>
<script>
function zoom2(src)
{
    var w = window.open("", "_blank");
    w.document.write("<img src='" + src + "' style='width:200%'>");
    w.document.close();
    return false;
}
</script>    
</body>
</html>
