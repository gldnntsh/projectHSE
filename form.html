<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказ товаров</title>
</head>
<body>

    <h1>Заказ товаров из электронного магазина</h1>

    <!--отправляет данные на сервер httpbin.org -->
    <form action="https://httpbin.org/post" method="POST">
        
        <p>Ваше имя:</p><br>
        <input type="text" name="client_name" placeholder="Иван Иванов" required><br><br>

        <p>Куда хотите поехать?:</p>
        <select name="destination">
        <option value="Китай">Китай</option>
        <option value="Мьянма">Мьянма</option>
        <option value="США">США</option>
        <option value="Беларусь">Беларусь</option>
        </select><br><br>
        
        <p>Бюджет на человека:</p>
        <input type="number" name="budget" value="50000" min="10000"><br><br>

        <p>Дата вылета:</p>
        <input type="date" name="departure_date"><br><br>

        <p>Класс перелета:</p>
        <input type="radio" name="class" value="Эконом" checked> Эконом<br>
        <input type="radio" name="class" value="Бизнес"> Бизнес<br><br>

        <p>Что важно в поездке?:</p>
        <input type="checkbox" name="preferences" value="Пляж" checked> Пляж<br>
        <input type="checkbox" name="preferences" value="Экскурсия"> Экскурсия<br>
        <input type="checkbox" name="preferences" value="Шоппинг"> Шоппинг<br><br>

        <p>Электронная почта:</p>
        <input type="email" name="email" placeholder="ivan@mail.ru" required><br>

        <input type="hidden" name="form_type" value="tour_selection">

        <button type="submit" style="padding: 10px 20px; background: tomato; color: black">
            Оформить заказ
        </button>
    </form>
</body>
</html>
