<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>таблица и фото</title>
    <style>
       th, td {
            border: 2px solid red;
            padding:10px;
           
       }
        th {
            text-align: left;
        }
        table {
            background-color:gray;
            background-image: url('image/cityphoto.jpg');
            background-size: cover;
            background-position: center;
            border-spacing: 15px;
            border-collapse: separate;
            width:600px;
            margin: 0 auto;
        }
     </style>    
</head>
<body>
        <h2> список мест для посещения</h2>
        <ul style="list-style-type:square;">
             <li>китай</li>
             <li>мьянма</li>
             <li>сша</li>
                 <ul style="list-style-type:circle";>
                    <li>Нью-Йорк</li>
                    <li>Вашингтон</li>
                 </ul>
             <li>беларусь</li>
        </ul>
        <hr>
        <table>
        <caption align=center>таблица</caption>
            <!-- row one -->
            <tr style="height:100px">
              <td> <img src="image/cityphoto1.jpg" height="50" alt="" style="display: block; margin-left: auto;"><br>
              подпись </td>
              <td></td>
              <td style="width:200px; background-image: url('image/cityphoto2.jpg')"> </td>
            </tr> 
            <!-- row two -->
            <tr style="height:20px">
                <td colspan=3></td>
            </tr>
            <!-- row three-->
            <tr>
                <td style="width: 400px; height: 300px"> ячейка 400 на 300</td>
                <td style="background-color:green"> зеленый </td>
            </tr>
            <!--row four -->
            <tr>
                <td style="width: 50%">
                    <table style="width: 100%; border-collapse: collapse;">
                        <tr>
                            <td><img src="image/cityphoto3.jpg" width="60" alt=""></td>
                            <td>ячейка</td>
                        </tr>
                        <tr>
                            <td>ячейка</td>
                            <td>ячейка</td>
                        </tr>
                    </table>
                </td>
                <td style="width: 50%; text-align: right;"><img src="image/cityphoto4.jpg" width="60" alt=""></td>
            </tr>                 
        </table>
        
</body>
